# Repository settings managed by the Probot "Settings" GitHub App.
# https://github.com/apps/settings  ·  https://github.com/repository-settings/app
#
# Editing this file (on the default branch) updates the repo's About panel,
# topics, and listed options. Install the "Settings" app on the repo for it to
# take effect; otherwise this file documents the intended configuration.

repository:
  name: site-platform-detector
  description: >-
    Privacy-first Chrome extension that detects the CMS, website builder, and
    full tech stack behind any site — WordPress, Shopify, Wix, Webflow, and
    more. 100% local, no tracking.
  homepage: https://anupammondal.in/chrome-extension/website-framework-detector

  topics:
    - chrome-extension
    - manifest-v3
    - cms-detection
    - tech-stack
    - wappalyzer-alternative
    - wordpress
    - shopify
    - privacy

  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true

  default_branch: main

  # Keep PR history tidy
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  delete_branch_on_merge: true

labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: detection
    color: fbca04
    description: Platform / tech-stack detection accuracy
  - name: security
    color: b60205
    description: Security-related issue (report privately first)
