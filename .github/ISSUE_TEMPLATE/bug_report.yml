name: 🐛 Bug report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I click "Detect Framework" on ..., I see ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected website URL
      description: The exact page where the problem occurs (required for detection issues).
      placeholder: https://example.com
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: The extension should have detected WordPress.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      value: |
        1. Go to '...'
        2. Click the extension icon
        3. Click 'Detect Framework'
        4. See error
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: e.g. 1.2.2
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 126 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors / screenshots
      description: Paste any errors from the popup or page console, and attach screenshots if helpful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I am running the latest version of the extension.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
